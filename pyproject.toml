[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-earth-engineering-os"
version = "1.3.0"
description = "Local-first engineering intelligence platform core"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary - New Earth Advanced Technologies Ltd"}
authors = [{name = "New Earth Advanced Technologies Ltd"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
neos = "neos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
